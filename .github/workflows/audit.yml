name: Audit dependencies

on:
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 5 * * 1" # weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Frontend — pnpm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit (fail on moderate+)
        run: pnpm audit --audit-level moderate
      - name: Outdated report (informational)
        run: pnpm outdated --long || true

  backend-audit:
    name: Backend — go vet + govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  secrets:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    name: Frontend — license audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Block copyleft licenses
        run: pnpm dlx license-checker --production --failOn 'GPL-3.0;AGPL-3.0;SSPL-1.0'
      - name: License summary (informational)
        run: pnpm dlx license-checker --production --summary || true

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # SBOM generation is heavier than audit; run only on schedule + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Frontend — install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # cyclonedx-npm shells out to `npm ls`, which cannot read a pnpm-installed
      # tree; cdxgen parses pnpm-lock.yaml directly.
      - name: Frontend — CycloneDX SBOM
        working-directory: frontend
        run: pnpm dlx @cyclonedx/cdxgen@12 --type pnpm --no-recurse --output sbom.frontend.cdx.json .
      - name: Backend — install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
      - name: Backend — CycloneDX SBOM
        working-directory: backend
        run: cyclonedx-gomod mod -json -licenses -output sbom.backend.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            frontend/sbom.frontend.cdx.json
            backend/sbom.backend.cdx.json
          retention-days: 90
