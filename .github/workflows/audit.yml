name: Audit dependencies

on:
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 5 * * 1" # weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Frontend — pnpm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit (fail on moderate+)
        run: pnpm audit --audit-level moderate
      - name: Outdated report (informational)
        run: pnpm outdated --long || true

  backend-audit:
    name: Backend — go vet + govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck
        run: govulncheck ./...

  secrets:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    name: Frontend — license audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # license-checker's last release is 25.0.1 (2019); rseidelsohn is the
      # maintained drop-in fork.
      - name: Block copyleft licenses
        run: pnpm dlx license-checker-rseidelsohn --production --failOn 'GPL-3.0;AGPL-3.0;SSPL-1.0'
      - name: License summary (informational)
        run: pnpm dlx license-checker-rseidelsohn --production --summary || true

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # SBOM generation is heavier than audit; run only on schedule + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Frontend — install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # cyclonedx-npm shells out to `npm ls`, which cannot read a pnpm-installed
      # tree; cdxgen parses pnpm-lock.yaml directly.
      - name: Frontend — CycloneDX SBOM
        working-directory: frontend
        run: pnpm dlx @cyclonedx/cdxgen@12 --type pnpm --no-recurse --output sbom.frontend.cdx.json .
      - name: Backend — install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Backend — CycloneDX SBOM
        working-directory: backend
        run: cyclonedx-gomod mod -json -licenses -output sbom.backend.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: |
            frontend/sbom.frontend.cdx.json
            backend/sbom.backend.cdx.json
          retention-days: 90
